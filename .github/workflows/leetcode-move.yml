name: Move LeetCode Solutions

on:
  workflow_dispatch:
  push:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'   # LeetHub가 루트에 만드는 폴더 패턴

permissions:
  contents: write

# LeetHub의 연속 push로 잡이 겹쳐 돌면 push가 충돌하므로 직렬 실행
concurrency:
  group: move-leetcode
  cancel-in-progress: false

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 루트에 생긴 LeetHub 폴더를 LeetCode/ 아래로 이동 (없으면 그냥 통과)
      - name: Move LeetCode solutions
        run: |
          shopt -s nullglob
          dirs=([0-9][0-9][0-9][0-9]-*/)
          if [ ${#dirs[@]} -gt 0 ]; then
            mkdir -p LeetCode
            mv "${dirs[@]}" LeetCode/
          fi

      # 이동한 게 있을 때만 커밋, push 전 원격 변경 반영
      - name: Commit & push
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "chore: move LeetCode solutions to LeetCode folder"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
