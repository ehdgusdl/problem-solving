name: Move LeetCode Solutions

on:
  workflow_dispatch:
  push:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'   # LeetHub가 루트에 만드는 폴더 패턴

permissions:
  contents: write

# LeetHub의 연속 push로 잡이 겹쳐 돌면 push가 충돌하므로 직렬 실행
concurrency:
  group: move-leetcode
  cancel-in-progress: false

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Move LeetCode solutions & push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 트리거 시점 SHA가 아니라 항상 최신 main 위에서 작업 (리베이스 충돌 원인 제거)
          git fetch origin main
          git reset --hard origin/main

          shopt -s nullglob
          dirs=([0-9][0-9][0-9][0-9]-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No LeetHub folders at root"
            exit 0
          fi

          # 같은 이름 폴더가 이미 LeetCode/에 있으면 내용만 합침
          for d in "${dirs[@]}"; do
            mkdir -p "LeetCode/$d"
            cp -a "$d." "LeetCode/$d"
            rm -rf "$d"
          done

          git add -A
          git commit -m "chore: move LeetCode solutions to LeetCode folder"
          git push
